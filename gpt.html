<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentGPT - Your AI Learning Assistant</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.3/dist/tailwind.min.css" rel="stylesheet">
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <style>
        :root {
            --dark-bg: #121212;
            --dark-surface: #1e1e1e;
            --dark-surface-2: #2d2d2d;
            --dark-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-color: #2196f3;
            --primary-dark: #1976d2;
            --primary-light: #64b5f6;
            --accent-color: #7e57c2;
            --accent-dark: #5e35b1;
            --success-color: #4caf50;
            --error-color: #f44336;
            --warning-color: #ff9800;
            --border-radius-sm: 4px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.5);
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            overflow: hidden;
        }

        .bg-animation .square {
            position: absolute;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            border-radius: 10px;
            animation: float 25s linear infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0% {
                transform: translateY(100%) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-1000%) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 2rem 0;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        /* Chat Container */
        .chat-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-box {
            background-color: var(--dark-surface);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--dark-border);
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 60vh;
            min-height: 400px;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-lg);
        }

        /* Message Styles */
        .message {
            max-width: 80%;
            margin-bottom: 1rem;
            animation: fadeIn 0.3s ease-out forwards;
            position: relative;
        }

        .message-user {
            align-self: flex-end;
            background: linear-gradient(45deg, var(--primary-color), var(--primary-dark));
            color: white;
            border-radius: 18px 18px 4px 18px;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
        }

        .message-bot {
            align-self: flex-start;
            background: linear-gradient(45deg, var(--accent-color), var(--accent-dark));
            color: white;
            border-radius: 18px 18px 18px 4px;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input Area */
        .input-area {
            display: flex;
            margin-top: 1rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 10;
        }

        .message-input {
            flex-grow: 1;
            background-color: var(--dark-surface-2);
            border: 1px solid var(--dark-border);
            border-radius: var(--border-radius-md);
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            margin-right: 0.75rem;
            box-shadow: var(--shadow-sm);
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
        }

        .send-button {
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: var(--border-radius-md);
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .send-button:active {
            transform: translateY(1px);
        }

        .send-button i {
            margin-left: 0.5rem;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            margin-left: 0.5rem;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            margin-right: 3px;
            opacity: 0.6;
        }

        .typing-indicator span:nth-child(1) {
            animation: blink 1s infinite 0.2s;
        }

        .typing-indicator span:nth-child(2) {
            animation: blink 1s infinite 0.4s;
        }

        .typing-indicator span:nth-child(3) {
            animation: blink 1s infinite 0.6s;
            margin-right: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 8px 16px;
            background-color: var(--dark-surface);
            border-radius: var(--border-radius-md);
            transition: all var(--transition-fast);
            z-index: 100;
        }

        .back-button:hover {
            color: var(--primary-color);
            background-color: var(--dark-surface-2);
            transform: translateX(-5px);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .chat-box {
                min-height: 300px;
                max-height: 50vh;
            }

            .message {
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .send-button {
                padding: 0.75rem 1rem;
            }

            .send-button span {
                display: none;
            }

            .send-button i {
                margin-left: 0;
            }

            .chat-box {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Header -->
    <header class="header">
        <h1 class="logo">StudentGPT</h1>
        <p class="tagline">Your AI-powered Learning Assistant</p>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
        <div class="chat-box" id="chatbox"></div>

        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Ask me anything about your studies..."
                autocomplete="off"
            />
            <button id="sendButton" class="send-button">
                <span>Send</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <!-- Main Script -->
    <script>
        // Initialize background animation
        function createBackgroundAnimation() {
            const bgAnimation = document.getElementById('bgAnimation');
            const squareCount = 15;

            for (let i = 0; i < squareCount; i++) {
                const square = document.createElement('div');
                square.classList.add('square');

                // Random size between 30px and 100px
                const size = Math.random() * 70 + 30;
                square.style.width = `${size}px`;
                square.style.height = `${size}px`;

                // Random position
                square.style.left = `${Math.random() * 100}%`;

                // Random delay
                square.style.animationDelay = `${Math.random() * 15}s`;

                // Random duration between 15s and 30s
                square.style.animationDuration = `${Math.random() * 15 + 15}s`;

                bgAnimation.appendChild(square);
            }
        }

        // Initialize chat functionality
        const chatbox = document.getElementById('chatbox');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatId = crypto.randomUUID();

        let receiving = false;
        const systemPrompt =
            'You are StudentGPT, a knowledgeable AI assistant designed to help students with their studies. You provide clear, accurate, and helpful explanations on academic topics. You are friendly, encouraging, and patient. You can assist with homework questions, explain complex concepts, provide study tips, and help students understand difficult subjects. Always aim to educate rather than just provide answers.';

        // Add a welcome message when the page loads
        function addWelcomeMessage() {
            setTimeout(() => {
                const welcomeMessage = createMessageElement(
                    "👋 Hi there! I'm StudentGPT, your AI learning assistant. How can I help with your studies today?",
                    'bot'
                );
                chatbox.appendChild(welcomeMessage);
                chatbox.scrollTop = chatbox.scrollHeight;
            }, 500);
        }

        function createMessageElement(text, type) {
            const messageElement = document.createElement('div');
            messageElement.className = `message message-${type}`;

            if (type === 'bot' && text === '') {
                // Create typing indicator for empty bot messages
                const typingIndicator = document.createElement('div');
                typingIndicator.className = 'typing-indicator';
                typingIndicator.innerHTML = '<span></span><span></span><span></span>';
                messageElement.appendChild(typingIndicator);
            } else {
                messageElement.textContent = text;
            }

            return messageElement;
        }

        function connectWebSocket(message) {
            receiving = true;
            const url = 'wss://backend.buildpicoapps.com/api/chatbot/chat';
            const websocket = new WebSocket(url);

            websocket.addEventListener('open', () => {
                websocket.send(
                    JSON.stringify({
                        chatId: chatId,
                        appId: 'consider-art',
                        systemPrompt: systemPrompt,
                        message: message,
                    })
                );
            });

            const messageElement = createMessageElement('', 'bot');
            chatbox.appendChild(messageElement);

            let responseText = '';

            websocket.onmessage = (event) => {
                // Remove typing indicator if present
                const typingIndicator = messageElement.querySelector('.typing-indicator');
                if (typingIndicator) {
                    messageElement.removeChild(typingIndicator);
                }

                responseText += event.data;
                messageElement.textContent = responseText;
                chatbox.scrollTop = chatbox.scrollHeight;
            };

            websocket.onclose = (event) => {
                // Remove typing indicator if present
                const typingIndicator = messageElement.querySelector('.typing-indicator');
                if (typingIndicator) {
                    messageElement.removeChild(typingIndicator);
                }

                if (event.code === 1000) {
                    receiving = false;
                } else {
                    messageElement.textContent = 'Error getting response from server. Please try again.';
                    messageElement.style.color = 'var(--error-color)';
                    chatbox.scrollTop = chatbox.scrollHeight;
                    receiving = false;
                }
            };
        }

        // Send message function
        function sendMessage() {
            if (!receiving && messageInput.value.trim() !== '') {
                const messageText = messageInput.value.trim();
                messageInput.value = '';

                // Create and add user message
                const messageElement = createMessageElement(messageText, 'user');
                chatbox.appendChild(messageElement);
                chatbox.scrollTop = chatbox.scrollHeight;

                // Get response from AI
                connectWebSocket(messageText);
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !receiving && messageInput.value.trim() !== '') {
                event.preventDefault();
                sendMessage();
            }
        });

        // Focus input field when page loads
        messageInput.focus();

        // Initialize animations and welcome message
        document.addEventListener('DOMContentLoaded', () => {
            // Create background animation
            createBackgroundAnimation();

            // Add welcome message
            addWelcomeMessage();

            // Animate elements
            gsap.from('.logo', {opacity: 0, y: -30, duration: 0.8, ease: 'power3.out'});
            gsap.from('.tagline', {opacity: 0, y: -20, duration: 0.8, delay: 0.2, ease: 'power3.out'});
            gsap.from('.chat-box', {opacity: 0, y: 20, duration: 0.8, delay: 0.3, ease: 'power3.out'});
            gsap.from('.input-area', {opacity: 0, y: 20, duration: 0.8, delay: 0.4, ease: 'power3.out'});
            gsap.from('.back-button', {opacity: 0, x: -20, duration: 0.8, delay: 0.5, ease: 'power3.out'});
        });
    </script>
  </body>
</html>
