<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Quizzes</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <!-- Font Awesome (ensure this is v6+ for brand icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <div class="container quiz-main-container">
        <h1 class="page-title">Programming Quizzes</h1>
        <p class="page-subtitle">Test your knowledge in various programming languages.</p>

        <div class="row">

            <!-- Python Quiz Card -->
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="quiz-card h-100">
                    <div class="quiz-card-inner">
                        <div class="quiz-icon python-icon">
                            <i class="fab fa-python"></i>
                        </div>
                        <h3 class="quiz-title">Python Quiz</h3>
                        <!-- Ensure relative path is correct -->
                        <a href="..\python interface\index.html" class="quiz-button mt-auto">
                            <span>START QUIZ</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Java Quiz Card -->
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="quiz-card h-100">
                    <div class="quiz-card-inner">
                        <div class="quiz-icon java-icon">
                            <i class="fab fa-java"></i>
                        </div>
                        <h3 class="quiz-title">Java Quiz</h3>
                         <!-- Ensure relative path is correct -->
                        <a href="..\java interface\index.html" class="quiz-button mt-auto">
                            <span>START QUIZ</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- C Language Quiz Card -->
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="quiz-card h-100">
                    <div class="quiz-card-inner">
                        <div class="quiz-icon c-icon">
                            <!-- Font Awesome doesn't have a specific C icon, use 'code' -->
                            <i class="fas fa-code"></i>
                        </div>
                        <h3 class="quiz-title">C Language Quiz</h3>
                         <!-- Ensure relative path is correct -->
                        <a href="..\c interface\index.html" class="quiz-button mt-auto">
                            <span>START QUIZ</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- HTML Quiz Card -->
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="quiz-card h-100">
                    <div class="quiz-card-inner">
                        <div class="quiz-icon html-icon">
                            <i class="fab fa-html5"></i>
                        </div>
                        <h3 class="quiz-title">HTML Quiz</h3>
                         <!-- Ensure relative path is correct -->
                        <a href="..\html interface\index.html" class="quiz-button mt-auto">
                            <span>START QUIZ</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
            <!-- Add more cards here following the same pattern -->

        </div> <!-- /.row -->
    </div> <!-- /.container -->

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</body>
</html>
