<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1><i class="fas fa-map-signs"></i> Custom Learning Roadmap</h1>
            <p class="subtitle">Select a language and timeframe to generate your personalized learning path</p>
        </div>

        <form id="roadmapForm" class="form-card">
            <div class="form-group">
                <label for="language"><i class="fas fa-code"></i> Select Language:</label>
                <div class="select-wrapper">
                    <input list="languages" id="language" name="language" required placeholder="Choose a language...">
                    <datalist id="languages">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="c">C</option>
                        <option value="reactjs">React JS</option>
                        <option value="nodejs">Node JS</option>
                        <option value="sql">SQL</option>
                        <option value="cplusplus">C++</option>
                        <option value="git">Git</option>
                        <option value="datastructures">Data Structures</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="r">R</option>
                    </datalist>
                </div>
            </div>

            <div class="form-group">
                <label for="months"><i class="fas fa-calendar-alt"></i> Number of Months:</label>
                <input type="number" id="months" name="months" min="1" max="24" required placeholder="1-24 months">
            </div>

            <button type="submit" class="generate-btn">
                <span>Generate Roadmap</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="roadmap-container">
            <div id="roadmap"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Click on any roadmap item to see detailed topics</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
