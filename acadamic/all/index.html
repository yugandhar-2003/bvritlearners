<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Videos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #e0e0e0;
            padding: 24px;
            text-align: center;
            margin: 0;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 30px;
            color: white;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #0073f5, #0D99E6);
            transition: width 0.3s ease;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            transition: all 0.3s ease;
        }
        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .card {
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            cursor: pointer;
            position: relative;
            border: 1px solid #333333;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 115, 245, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 115, 245, 0.2);
            border-color: rgba(0, 115, 245, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card a {
            text-decoration: none;
            color: #e0e0e0;
            display: block;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .card:hover a {
            color: white;
        }
        .card h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
            padding-bottom: 8px;
            transition: color 0.3s ease;
        }

        .card h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #0073f5, #0D99E6);
            transition: width 0.3s ease, transform 0.3s ease;
            transform: translateX(calc(50% - 20px));
        }

        .card:hover h2 {
            color: white;
        }

        .card:hover h2::after {
            width: 80%;
            transform: translateX(calc(50% - 40%));
        }
        .card.expanded {
            grid-column: 1 / -1;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #2d2d2d;
            transform: translateY(0) !important;
            border-color: rgba(0, 115, 245, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 115, 245, 0.2);
        }
        .card.expanded h2,
        .card.expanded p {
            display: none;
        }
        .exit-button {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(45deg, #0073f5, #0D99E6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .exit-button:hover {
            background: linear-gradient(45deg, #0D99E6, #0073f5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .exit-button:active {
            transform: translateY(-1px);
        }
        .expanded iframe {
            border-radius: 15px;
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 115, 245, 0.3);
        }

        .expanded iframe:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 115, 245, 0.2);
            transform: scale(1.02);
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 24px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .card.expanded .videos {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div>
        <h1>Academic Videos</h1>

        <div class="grid" id="video-grid">
            <div class="card">
                <a href="..\1st year\index.html">

                </a>
            </div>
            <div class="card">
                <a href="..\Cse\index.html">
                    <h2>Computer Science and Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\ECE\index.html">
                    <h2>Electronics and Communications Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\EEE\index.html">
                    <h2>Electrical and Electronics Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\Civil\index.html">
                    <h2>Civil Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\Mech\index.html">
                    <h2>Mechanical Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\Pharmacy\index.html">
                    <h2>Pharmaceutical Engineering</h2>
                </a>
            </div>
            <div class="card">
                <a href="..\BioMedical\index.html">
                    <h2>Biomedical Engineering</h2>
                </a>
            </div>
            <div class="card">

                </a>
            </div>
        </div>
    </div>
</body>
</html>
