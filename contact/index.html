<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BVRIT Learning</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    
    <style>
        /* Dark Theme Variables */
        :root {
            --dark-bg: #121212;
            --dark-surface: #1e1e1e;
            --dark-surface-2: #2d2d2d;
            --dark-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-color: #2196f3;
            --accent-color: #7e57c2;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            --transition: 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            overflow: hidden;
        }
        
        .bg-animation .square {
            position: absolute;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            border-radius: 10px;
            animation: float 25s linear infinite;
            opacity: 0.3;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100%) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-1000%) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Profile Card */
        .profile-card {
            background-color: var(--dark-surface);
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            position: relative;
            transition: all var(--transition);
            flex: 1;
            min-width: 300px;
        }
        
        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }
        
        /* Card Header */
        .card-header {
            height: 120px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            position: relative;
        }
        
        .card-header h3 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            z-index: 1;
        }
        
        /* Profile Image */
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid var(--dark-surface);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 45px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        
        .profile-image:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Card Body */
        .card-body {
            padding: 80px 30px 30px;
            text-align: center;
        }
        
        .profile-name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .profile-info {
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-size: 1rem;
        }
        
        .profile-college {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-style: italic;
        }
        
        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--dark-surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        
        .social-link:hover {
            transform: translateY(-5px);
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
        }
        
        .social-link img {
            width: 24px;
            height: 24px;
            transition: all var(--transition);
        }
        
        .social-link:hover img {
            filter: brightness(0) invert(1);
        }
        
        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 8px 16px;
            background-color: var(--dark-surface);
            border-radius: 5px;
            transition: all var(--transition);
            z-index: 100;
        }
        
        .back-button:hover {
            color: var(--primary-color);
            background-color: var(--dark-surface-2);
            transform: translateX(-5px);
        }
        
        /* Responsive Styles */
        @media (max-width: 480px) {
            .profile-card {
                max-width: 320px;
            }
            
            .profile-image {
                width: 120px;
                height: 120px;
                top: 60px;
            }
            
            .card-body {
                padding: 70px 20px 25px;
            }
            
            .profile-name {
                font-size: 1.5rem;
            }
            
            .profile-info {
                font-size: 0.9rem;
            }
            
            .profile-college {
                font-size: 0.8rem;
            }
            
            .social-link {
                width: 40px;
                height: 40px;
            }
            
            .social-link img {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>
    
    <!-- Back Button -->
    <a href="../index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    
    <!-- Profile Cards Container -->
    <div style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px;">
        <!-- Dr. Yogameena's Profile Card -->
        <div class="profile-card">
            <div class="card-header">
                <h3>Developer</h3>
                <div class="profile-image">
                    <img src="yogimama.jpeg" alt="Profile Image">
                </div>
            </div>
            
            <div class="card-body">
                <h2 class="profile-name">Dr.B.Yogameena</h2>
                <p class="profile-info">21211A0501</p>
                <p class="profile-info">CSE [2021-2025]</p>
                <p class="profile-college">B V Raju Institute of Technology</p>
                
                <div class="social-links">
                    <a href="mailto:yogameena.b@bvrit.ac.in" class="social-link">
                        <img src="mail.png" alt="Email">
                    </a>
                    <a href="https://www.linkedin.com/in/yogameena-b-a5b0b71b4" class="social-link">
                        <img src="linkedin.png" alt="LinkedIn">
                    </a>
                    <a href="https://github.com/yogameena" class="social-link">
                        <img src="github.png" alt="GitHub">
                    </a>
                    <a href="https://www.instagram.com/dr.yogameena" class="social-link">
                        <img src="instagram-new.png" alt="Instagram">
                    </a>
                </div>
            </div>
        </div>

        <!-- Ruthwik's Profile Card -->
        <div class="profile-card">
            <div class="card-header">
                <h3>Redesigned by</h3>
            </div>
            <div class="card-body">
                <h2 class="profile-name">G.Ruthwik</h2>
                <p class="profile-info">24211A05L5</p>
                <p class="profile-info">CSE [2024-2028]</p>
                <p class="profile-college">B V Raju Institute of Technology</p>
                
                <div class="social-links">
                    <a href="mailto:ruthwik.g@bvrit.ac.in" class="social-link">
                        <img src="mail.png" alt="Email">
                    </a>
                    <a href="https://www.linkedin.com/in/ruthwik-g" class="social-link">
                        <img src="linkedin.png" alt="LinkedIn">
                    </a>
                    <a href="https://github.com/ruthwik" class="social-link">
                        <img src="github.png" alt="GitHub">
                    </a>
                    <a href="https://www.instagram.com/ruthwik.g" class="social-link">
                        <img src="instagram-new.png" alt="Instagram">
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize background animation
        function createBackgroundAnimation() {
            const bgAnimation = document.getElementById('bgAnimation');
            const squareCount = 15;
            
            for (let i = 0; i < squareCount; i++) {
                const square = document.createElement('div');
                square.classList.add('square');
                
                // Random size between 30px and 100px
                const size = Math.random() * 70 + 30;
                square.style.width = `${size}px`;
                square.style.height = `${size}px`;
                
                // Random position
                square.style.left = `${Math.random() * 100}%`;
                
                // Random delay
                square.style.animationDelay = `${Math.random() * 15}s`;
                
                // Random duration between 15s and 30s
                square.style.animationDuration = `${Math.random() * 15 + 15}s`;
                
                bgAnimation.appendChild(square);
            }
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Create background animation
            createBackgroundAnimation();
            
            // Animate elements with GSAP
            if (typeof gsap !== 'undefined') {
                gsap.from('.profile-card', {opacity: 0, y: 30, duration: 1, ease: 'power3.out'});
                // Changed from gsap.from to gsap.to to ensure the image stays visible
                // First make sure the image is visible initially
                gsap.set('.profile-image', {opacity: 1, scale: 1});
                // Then apply a subtle animation effect that won't make it disappear
                gsap.to('.profile-image', {scale: 1.05, duration: 0.8, delay: 0.3, ease: 'back.out(1.7)', yoyo: true, repeat: 1});
                gsap.from('.profile-name', {opacity: 0, y: 20, duration: 0.8, delay: 0.5, ease: 'power3.out'});
                gsap.from('.profile-info', {opacity: 0, y: 20, duration: 0.8, delay: 0.7, stagger: 0.1, ease: 'power3.out'});
                gsap.from('.profile-college', {opacity: 0, y: 20, duration: 0.8, delay: 0.9, ease: 'power3.out'});
                gsap.set('.social-link', {opacity: 1, y: 20});
                gsap.to('.social-link', {opacity: 1, y: 0, duration: 0.5, delay: 1.1, stagger: 0.1, ease: 'power3.out'});
                gsap.from('.back-button', {opacity: 0, x: -20, duration: 0.8, delay: 0.3, ease: 'power3.out'});
            }
        });
    </script>
</body>
</html>
