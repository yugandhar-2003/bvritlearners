<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BVRIT Learning</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

    <style>
        /* Dark Theme Variables */
        :root {
            --dark-bg: #121212;
            --dark-surface: #1e1e1e;
            --dark-surface-2: #2d2d2d;
            --dark-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-color: #2196f3;
            --accent-color: #7e57c2;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; /* Body acts as the main flex container */
            justify-content: center;
            align-items: center;
            padding: 80px 20px 20px; /* Added top padding to prevent overlap with back button */
            flex-wrap: wrap;
            gap: 30px; /* Gap between profile cards */
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            overflow: hidden;
        }

        .bg-animation .square {
            position: absolute;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            border-radius: 10px;
            animation: float 25s linear infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0% {
                transform: translateY(100%) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-1000%) rotate(360deg);
                opacity: 0;
            }
        }

        /* Profile Card */
        .profile-card {
            background-color: var(--dark-surface);
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            position: relative;
            transition: all var(--transition);
            flex: 1; /* Allows cards to grow/shrink */
            min-width: 300px; /* Minimum width before wrapping */
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        /* Card Header */
        .card-header {
            height: 120px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            position: relative;
            display: flex; /* Use flex to center content vertically */
            justify-content: center;
            align-items: center; /* Center text vertically */
        }

        .card-header h3 {
            /* Removed absolute positioning for better centering */
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            padding: 0 15px; /* Add some horizontal padding */
            text-align: center;
        }

        /* Profile Image */
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid var(--dark-surface);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 45px; /* Position relative to card-header */
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            z-index: 2; /* Ensure image is above header background */
        }

        .profile-image:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Card Body */
        .card-body {
            padding: 80px 30px 30px; /* Default padding (top is large for profile image) */
            text-align: center;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-info {
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .profile-college {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--dark-surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .social-link:hover {
            transform: translateY(-5px);
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
        }

        .social-link img {
            width: 24px;
            height: 24px;
            transition: all var(--transition);
        }

        .social-link:hover img {
            filter: brightness(0) invert(1);
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 8px 16px;
            background-color: var(--dark-surface);
            border-radius: 5px;
            transition: all var(--transition);
            z-index: 100;
        }

        .back-button:hover {
            color: var(--primary-color);
            background-color: var(--dark-surface-2);
            transform: translateX(-5px);
        }

        /* Responsive Styles */
        @media (max-width: 480px) {
            body {
                 padding-top: 70px; /* Adjust padding for smaller screens */
            }
            .profile-card {
                max-width: 320px;
                min-width: 280px; /* Adjust min-width */
            }

            .profile-image {
                width: 120px;
                height: 120px;
                top: 60px;
            }

            .card-body {
                /* Default padding adjusted slightly */
                padding: 70px 20px 25px;
            }
             /* Adjust padding specifically for cards without profile image on small screens */
            .profile-card:not(:has(.profile-image)) .card-body {
                 padding-top: 30px;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .profile-info {
                font-size: 0.9rem;
            }

            .profile-college {
                font-size: 0.8rem;
            }

            .social-link {
                width: 40px;
                height: 40px;
            }

            .social-link img {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>

    <script>
        // Initialize background animation
        function createBackgroundAnimation() {
            const bgAnimation = document.getElementById('bgAnimation');
            const squareCount = 15;

            for (let i = 0; i < squareCount; i++) {
                const square = document.createElement('div');
                square.classList.add('square');
                const size = Math.random() * 70 + 30;
                square.style.width = `${size}px`;
                square.style.height = `${size}px`;
                square.style.left = `${Math.random() * 100}%`;
                square.style.animationDelay = `${Math.random() * 15}s`;
                square.style.animationDuration = `${Math.random() * 15 + 15}s`;
                bgAnimation.appendChild(square);
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            createBackgroundAnimation();

            // Animate elements with GSAP
            if (typeof gsap !== 'undefined') {
                // Animate all profile cards together
                gsap.from('.profile-card', {opacity: 0, y: 30, duration: 1, stagger: 0.2, ease: 'power3.out'});

                // Animate profile image specifically (only for the card that has it)
                if (document.querySelector('.profile-image')) {
                     gsap.set('.profile-image', {opacity: 1, scale: 1});
                     gsap.from('.profile-image', {scale: 0.5, opacity: 0, duration: 0.8, delay: 0.3, ease: 'back.out(1.7)'});
                }

                // Stagger animations for content within each card
                gsap.from('.profile-name', {opacity: 0, y: 20, duration: 0.8, delay: 0.5, stagger: 0.2, ease: 'power3.out'});
                gsap.from('.profile-info', {opacity: 0, y: 20, duration: 0.8, delay: 0.7, stagger: 0.1, ease: 'power3.out'});
                gsap.from('.profile-college', {opacity: 0, y: 20, duration: 0.8, delay: 0.9, stagger: 0.2, ease: 'power3.out'});

                // Animate social links (ensure they are visible first)
                gsap.set('.social-link', {opacity: 0, y: 20}); // Start hidden
                gsap.to('.social-link', {opacity: 1, y: 0, duration: 0.5, delay: 1.1, stagger: 0.05, ease: 'power3.out'}); // Stagger within each card

                gsap.from('.back-button', {opacity: 0, x: -20, duration: 0.8, delay: 0.3, ease: 'power3.out'});
            }
        });
    </script>
